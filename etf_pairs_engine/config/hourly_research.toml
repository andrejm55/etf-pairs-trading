[engine]
mode = "paper"
loop_ms = 1000
warn_loop_ms = 250

[alpaca]
paper = true
trading_base_url = "https://paper-api.alpaca.markets"
data_base_url = "https://data.alpaca.markets"
api_key_env = "ALPACA_API_KEY"
secret_key_env = "ALPACA_SECRET_KEY"

[storage]
enabled = false
sqlite_path = "etf_pairs_audit.db"

[strategy]
rolling_window_ticks = 390
entry_zscore = 1.50
exit_zscore = 0.50
min_samples = 293
max_spread_bps = 100.0
min_half_life_ticks = 10

[execution]
passive_entry = true
stale_order_seconds = 10
max_leg_delay_seconds = 3
use_aggressive_rescue = true
client_order_prefix = "etf_pairs"

[risk]
initial_equity = 100000.0
max_pair_notional = 5000.0
max_total_notional = 5000.0
max_daily_loss = 100000.0
max_open_pairs = 1
max_holding_minutes = 195
require_easy_to_borrow_for_short = true

[[pairs]]
id = "SPY_IWM"
a = "SPY"
b = "IWM"
enabled = true
beta = 2.70
leg_notional = 2000.0
max_holding_bars = 195

[[pairs]]
id = "EFA_EEM"
a = "EFA"
b = "EEM"
enabled = true
beta = 1.80
leg_notional = 2000.0
max_holding_bars = 195

[[pairs]]
id = "XLE_OIH"
a = "XLE"
b = "OIH"
enabled = false
beta = 1.40
leg_notional = 2000.0
entry_zscore = 2.00
max_holding_bars = 195
