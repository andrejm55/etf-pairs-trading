[package]
name = "etf_pairs_engine"
version = "0.1.0"
edition = "2021"
description = "Low-latency ETF pairs trading engine for Alpaca paper/live trading"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1"
dotenvy = "0.15"
futures = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# SQLite is intentionally optional-ish at code level: the engine runs without DB if disabled.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

[dev-dependencies]
approx = "0.5"
